[project]
name = "voice-lab"
version = "0.1.0"
description = "Experimento 05 — Agentes de Voz com LangGraph, LiveKit, Inferência Local e MLflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.15.0",
    "psutil>=6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "mlx>=0.18.0",
    "mlx-whisper>=0.3.0",
    "kokoro-onnx>=0.6.0",
    "sounddevice>=0.5.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
